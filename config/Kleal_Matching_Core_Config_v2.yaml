semantic_tiers:
  T0_exact_active_intent:
    personal_outreach: true
    discovery: true
  T1_direct_interest:
    personal_outreach: true
    discovery: true
  T2_parent_category:
    personal_outreach: requires_broad_matching_consent
    discovery: true
  T3_adjacent_context:
    personal_outreach: false
    discovery: requires_broad_matching_consent
  T4_alternative_solution_type:
    personal_outreach: false
    discovery: true
  T5_no_meaningful_overlap:
    personal_outreach: false
    discovery: false
outreach:
  default_parallel_proposals: 2
  urgent_same_day_parallel_proposals: 3
  max_proposals_received_per_user_24h: 4
  max_passive_proposals_received_per_user_7d: 3
  proposal_ttl_minutes: 720
  reservation_ttl_minutes: 20
  quiet_hours_local:
  - '22:00'
  - 09:00
  wave_delays_minutes:
  - 0
  - 120
  - 480
  passive_outreach_default: off_unless_receiving_policy_allows
group_formation:
  supported_size_min: 3
  supported_size_max_mvp: 8
  min_quorum_default: 3
  utility_weights:
    least_misery: 0.35
    mean_member_relevance: 0.25
    role_coverage: 0.2
    time_overlap: 0.1
    diversity_budget: 0.1
user_facing_bands:
  especially_close:
    min_lcb: 0.78
    min_coverage: 0.75
  strong_option:
    min_lcb: 0.66
    min_coverage: 0.6
  broader_option:
    min_lcb: 0.52
    min_coverage: 0.4
  needs_clarification:
    max_coverage: 0.39
score_semantics:
  policy_decision: ALLOW|BLOCK|REVIEW
  semantic_tier: categorical provenance; never derived from score
  relevance_score: 0..1 internal heuristic or calibrated model; not a human-compatibility percentage
  evidence_coverage: 0..1 proportion of applicable feature weight supported by known evidence
  relevance_lcb: clamp(relevance_mean - uncertainty_lambda*(1-coverage), 0, 1)
  reciprocal_relevance: 0.7*min(R_A_to_B,R_B_to_A)+0.3*mean(R_A_to_B,R_B_to_A)
  acceptance_probability: only after calibration; absent in rule-based MVP
  allocation_action: system-level decision; never included in user-facing relevance
